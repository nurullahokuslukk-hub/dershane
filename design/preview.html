async function api(path,method='GET',body){

function academic(){$('#section').innerHTML=`<div class="layout"><div class="panel"><div class="panel-head"><h2>Akademik ve çalışma kayıtları</h2>${me.role==='student'?'<button id="addRecord">Kayıt ekle</button>':''}</div><div id="recordForm"></div>${profile.records.map(r=>`<div class="record"><p>${E(recordSummary(r))}</p><p class="muted small">${E(r.day)} · ${E(r.source)}</p></div>`).join('')||'<div class="empty">Henüz kayıt yok.</div>'}<p class="small muted">En fazla son 300 kayıt gösterilir.</p></div><div class="stack"><div class="note">Öğrencinin girdiği çalışma ve soru miktarı beyana dayanır. Telefon verisi bu beyanı doğrulayan bir kanıt değildir.</div></div></div>`;if($('#addRecord'))$('#addRecord').onclick=recordForm;}
function recordForm(){const kinds=me.role==='student'?[['study','Çalışma'],['questions','Soru'],['checkin','Günlük bildirim']]:[['exam','Deneme'],['homework','Ödev'],['attendance','Etüt katılımı']];$('#recordForm').innerHTML=`<form id="newRecord" class="form-stack"><div class="form-grid"><label>Kayıt türü<select name="kind" id="kind">${kinds.map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label><label>Gün<input name="day" type="date" value="${new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul'}).format(new Date())}" required></label></div><div id="recordFields" class="form-stack"></div><p id="recordError" role="alert"></p><div class="actions"><button class="primary">Kaydet</button><button type="button" id="cancelRecord">İptal</button></div></form>`;$('#cancelRecord').onclick=academic;$('#kind').onchange=fields;fields();const clientRecordId=crypto.randomUUID();$('#newRecord').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target)),kind=b.kind;let payload;if(['study','questions'].includes(kind))payload={subject:b.subject,value:Number(b.value)};else if(kind==='exam')payload={title:b.title,correct:Number(b.correct),wrong:Number(b.wrong),blank:Number(b.blank),divisor:Number(b.divisor)};else payload={state:b.state,...(kind==='checkin'?{}:{title:b.title})};const btn=e.target.querySelector('button');btn.disabled=true;try{await api('/students/'+selected+'/records','POST',{clientRecordId,kind,day:b.day,payload});profile=await api('/students/'+selected);academic();toast('Kayıt kaydedildi.');}catch(err){$('#recordError').textContent=err.message;btn.disabled=false;}};}
function fields(){const k=$('#kind').value;$('#recordFields').innerHTML=['study','questions'].includes(k)?`<div class="form-grid"><label>Ders<input name="subject" required maxlength="60" value="Matematik"></label><label>${k==='study'?'Dakika':'Soru adedi'}<input type="number" name="value" required min="1" max="${k==='study'?720:2000}" value="30"></label></div>`:k==='exam'?`<label>Deneme / test adı<input name="title" required maxlength="120"></label><div class="form-grid">${[['correct','Doğru',0],['wrong','Yanlış',0],['blank','Boş',0],['divisor','Yanlış ceza böleni',4]].map(([name,label,value])=>`<label>${label}<input type="number" name="${name}" min="${name==='divisor'?1:0}" max="${name==='divisor'?10:200}" value="${value}" required></label>`).join('')}</div>`:`${k!=='checkin'?'<label>Başlık<input name="title" required maxlength="120"></label>':''}<label>Durum<select name="state">${(k==='checkin'?['completed','partial','not_started','prefer_not_to_say']:k==='homework'?['assigned','verified']:['present','absent','excused']).map(s=>`<option value="${s}">${states[s]}</option>`).join('')}</select></label>`;}
function notes(){$('#section').innerHTML=`<div class="layout"><div class="panel"><h2>Rehberlik notları</h2><p class="muted small" style="margin:8px 0 24px">Yalnızca atanmış rehberlik erişebilir. Sağlık bilgisi ve özel nitelikli veri yazmayın.</p><form id="noteForm" class="form-stack"><label>Görüşme notu<textarea name="body" required maxlength="2000" placeholder="Çalışma planıyla ilgili görüşmeyi özetleyin."></textarea></label><p id="noteError" role="alert"></p><button class="primary">Notu kaydet</button></form><div style="margin-top:24px">${profile.notes.map(n=>`<div class="record"><p class="break">${E(n.body)}</p><p class="muted small">${E(n.created_at.slice(0,10))}</p></div>`).join('')||'<p class="muted">Henüz görüşme notu yok.</p>'}</div></div><aside><div class="note">Kurum yöneticisi ve branş öğretmeni özel rehberlik notunu otomatik olarak göremez.</div></aside></div>`;$('#noteForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{await api('/students/'+selected+'/notes','POST',Object.fromEntries(new FormData(e.target)));profile=await api('/students/'+selected);notes();toast(preview?'Önizleme notu eklendi; yenilemede silinir.':'Not kaydedildi.');}catch(err){$('#noteError').textContent=err.message;btn.disabled=false;}};}
function privacy(){const d=document.createElement('dialog');d.innerHTML='<h2>Gözetim değil, rehberlik.</h2><p>İsteğe bağlı paylaşımda uygulama adı/paket adı, günlük ön plan süresi, cihaz ve ölçüm penceresi sunucuya aktarılır. Sunucu kategoriyi belirler.</p><ul><li>Mesajlar, fotoğraflar, ekran içeriği, konum, mikrofon ve kamera toplanmaz.</li><li>Yalnızca öğrenci ve atanmış rehberlik kullanım verisini görür.</li><li>İzin reddedilirse akademik işlevler çalışmaya devam eder.</li><li>İptal sonrası yeni toplama durur; bekleyen kullanım kuyruğu temizlenir.</li></ul><p class="note">Bu demo hukuki onay değildir. Gerçek kullanım için KVKK, temsil/veli süreci ve Play incelemesi tamamlanmalıdır.</p><button id="closePrivacy" autofocus>Anladım</button>';document.body.append(d);const old=document.activeElement;d.addEventListener('close',()=>{d.remove();old?.focus();});d.showModal();$('#closePrivacy').onclick=()=>d.close();}
init();
</script></body></html>
